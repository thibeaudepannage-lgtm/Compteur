const SEUIL_APPART = 0.30;      // +30% conso appartement vs visite précédente
const SEUIL_RESEAU_DEFAUT = 0.10; // 10% d'écart principal vs somme divisionnaires
const PHOTO_MAX_PX = 1000;      // redimensionnement max
const PHOTO_QUALITE = 0.6;      // compression JPEG

// ------------------------------------------------------------------
// IndexedDB — couche de stockage
// ------------------------------------------------------------------
const DB_NAME = "eauvea_pro";
const DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("immeubles")) {
        db.createObjectStore("immeubles", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("photos")) {
        db.createObjectStore("photos", { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbGetAll(store) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readonly");
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(store, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readwrite");
    tx.objectStore(store).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function dbDelete(store, id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readwrite");
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function dbGet(store, id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readonly");
    const req = tx.objectStore(store).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error("Échec chargement " + src));
    document.head.appendChild(s);
  });
}
async function ensureXLSX() {
  if (window.XLSX) return window.XLSX;
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  return window.XLSX;
}
async function ensureJSZip() {
  if (window.JSZip) return window.JSZip;
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
  return window.JSZip;
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nf = (n, d = 1) =>
  n === null || n === undefined || isNaN(n) ? "—" : Number(n).toLocaleString("fr-FR", { maximumFractionDigits: d });
const pf = (n) => (n === null || n === undefined || isNaN(n) ? "—" : (n * 100).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " %");
const today = () => new Date().toISOString().slice(0, 10);
const slug = (s) => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24);

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > PHOTO_MAX_PX) { height = Math.round(height * PHOTO_MAX_PX / width); width = PHOTO_MAX_PX; }
        else if (height > PHOTO_MAX_PX) { width = Math.round(width * PHOTO_MAX_PX / height); height = PHOTO_MAX_PX; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", PHOTO_QUALITE));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ------------------------------------------------------------------
// Lecture IA du compteur — appel API Claude, renvoie l'index lu (string) ou null
// L'IA propose, l'utilisateur valide toujours.
// ------------------------------------------------------------------
async function lireCompteurIA(dataUrl) {
  const media = dataUrl.substring(dataUrl.indexOf(":") + 1, dataUrl.indexOf(";"));
  const base64 = dataUrl.split(",")[1];
  const prompt = "Tu regardes la photo d'un compteur d'eau (m³). Lis l'index affiché : les chiffres du compteur, de gauche à droite. Sur les compteurs à molettes, les chiffres noirs sur fond blanc sont les m³ entiers ; les chiffres blancs sur fond rouge (après la virgule) sont les décimales/litres — ignore-les et ne renvoie que la partie entière en m³. Réponds UNIQUEMENT en JSON strict, sans texte ni backticks, au format : {\"index\": <nombre ou null>, \"confiance\": \"haute\"|\"moyenne\"|\"basse\", \"note\": \"<courte remarque si lecture incertaine, sinon vide>\"}. Si tu ne peux pas lire avec certitude, mets index à null et confiance à basse.";

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: media, data: base64 } },
          { type: "text", text: prompt },
        ],
      }],
    }),
  });
  const data = await response.json();
  const txt = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("").replace(/```json|```/g, "").trim();
  try {
    return JSON.parse(txt);
  } catch {
    return { index: null, confiance: "basse", note: "Lecture impossible" };
  }
}

// ------------------------------------------------------------------
// Calculs d'écart
// ------------------------------------------------------------------
function analyseVisite(imm, visite, precedente) {
  const principal = parseFloat(visite.principalValeur);
  const divs = visite.divisionnaires.map((d) => ({ ...d, val: parseFloat(d.valeur) }));
  const complets = divs.filter((d) => !isNaN(d.val));
  const sommeDiv = complets.reduce((s, d) => s + d.val, 0);
  const complet = complets.length === divs.length && divs.length > 0 && !isNaN(principal);

  let ecartReseau = null, ecartReseauPct = null;
  if (complet) {
    ecartReseau = principal - sommeDiv;
    ecartReseauPct = principal > 0 ? ecartReseau / principal : null;
  }
  const alerteReseau = complet && ecartReseauPct !== null && Math.abs(ecartReseauPct) > (imm.seuilReseau ?? SEUIL_RESEAU_DEFAUT);

  // Variation par appartement vs visite précédente
  const appartements = divs.map((d) => {
    let prev = null, conso = null, variation = null, alerte = false;
    if (precedente) {
      const dp = precedente.divisionnaires.find((x) => x.designation === d.designation && x.numero === d.numero);
      const pv = dp ? parseFloat(dp.valeur) : NaN;
      if (!isNaN(pv) && !isNaN(d.val)) {
        prev = pv; conso = d.val - pv;
        // base de comparaison : conso précédente si dispo
        variation = null;
      }
    }
    return { ...d, prev, conso, variation, alerte };
  });

  // variation = conso courante vs conso précédente (nécessite 2 intervalles)
  return {
    principal, sommeDiv, complet, complets: complets.length, total: divs.length,
    ecartReseau, ecartReseauPct, alerteReseau, appartements,
  };
}

// Variation appartement sur 2 intervalles (visite n-1 -> n vs n-2 -> n-1)
function variationsAppart(imm, visiteIndex) {
  const v = imm.visites[visiteIndex];
  const v1 = imm.visites[visiteIndex - 1];
  const v2 = imm.visites[visiteIndex - 2];
  return v.divisionnaires.map((d) => {
    const key = (x) => x.designation === d.designation && x.numero === d.numero;
    const cur = parseFloat(d.valeur);
    const p1 = v1?.divisionnaires.find(key);
    const p2 = v2?.divisionnaires.find(key);
    const cur1 = p1 ? parseFloat(p1.valeur) : NaN;
    const cur2 = p2 ? parseFloat(p2.valeur) : NaN;
    const consoActuelle = !isNaN(cur) && !isNaN(cur1) ? cur - cur1 : null;
    const consoPrec = !isNaN(cur1) && !isNaN(cur2) ? cur1 - cur2 : null;
    let variation = null, alerte = false;
    if (consoActuelle !== null && consoPrec !== null && consoPrec > 0) {
      variation = (consoActuelle - consoPrec) / consoPrec;
      alerte = variation > SEUIL_APPART;
    }
    return { designation: d.designation, numero: d.numero, consoActuelle, consoPrec, variation, alerte };
  });
}

function Champ({ label, value, onChange, placeholder, type = "text" }) {
  return (
    <div>
      <label style={S.label}>{label}</label>
      <input style={S.input} type={type} value={value} placeholder={placeholder}
        onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function PhotoInput({ photoId, onCapture, onRemove, label, onLire }) {
  const [url, setUrl] = useState(null);
  const [etat, setEtat] = useState("idle"); // idle | lecture | resultat
  const [lecture, setLecture] = useState(null); // {index, confiance, note}
  const inputRef = useRef();
  useEffect(() => {
    let live = true;
    if (photoId) dbGet("photos", photoId).then((p) => live && setUrl(p?.data || null));
    else setUrl(null);
    return () => { live = false; };
  }, [photoId]);

  const handle = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const data = await compressImage(file);
    const id = uid();
    await dbPut("photos", { id, data });
    onCapture(id);
  };

  const lancerLecture = async () => {
    if (!url) return;
    setEtat("lecture"); setLecture(null);
    try {
      const res = await lireCompteurIA(url);
      setLecture(res); setEtat("resultat");
    } catch {
      setLecture({ index: null, confiance: "basse", note: "Erreur de connexion à l'IA" });
      setEtat("resultat");
    }
  };

  const confCouleur = { haute: C.vert, moyenne: C.orange, basse: C.rouge };

  return (
    <div>
      {label && <label style={S.label}>{label}</label>}
      {url ? (
        <div>
          <div style={{ position: "relative", display: "inline-block" }}>
            <img src={url} alt="" style={{ width: 88, height: 88, objectFit: "cover", borderRadius: 8, border: `1px solid ${C.bord}` }} />
            <button onClick={() => { onRemove(); setUrl(null); setEtat("idle"); setLecture(null); }}
              style={{ position: "absolute", top: -8, right: -8, width: 22, height: 22, borderRadius: 11, border: "none", background: C.rouge, color: "#fff", cursor: "pointer", fontWeight: 700, lineHeight: "22px", padding: 0 }}>×</button>
          </div>
          {onLire && (
            <div style={{ marginTop: 6 }}>
              {etat !== "lecture" && (
                <button onClick={lancerLecture}
                  style={{ ...S.btn, background: "#eaf2f7", color: C.bleu, border: `1px solid ${C.cyan}`, padding: "6px 10px", fontSize: 12, width: 88 }}>
                  🔍 Lire l'index
                </button>
              )}
              {etat === "lecture" && (
                <div style={{ fontSize: 12, color: C.gris, width: 88, textAlign: "center", padding: "6px 0" }}>Lecture…</div>
              )}
              {etat === "resultat" && lecture && (
                <div style={{ marginTop: 4, width: 180 }}>
                  {lecture.index !== null && lecture.index !== undefined ? (
                    <div style={{ background: C.fond, border: `1px solid ${C.bord}`, borderRadius: 8, padding: 8 }}>
                      <div style={{ fontSize: 13 }}>Index lu : <b>{lecture.index} m³</b></div>
                      <div style={{ fontSize: 11, color: confCouleur[lecture.confiance] || C.gris, marginTop: 2 }}>
                        Confiance {lecture.confiance}{lecture.note ? ` · ${lecture.note}` : ""}
                      </div>
                      <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                        <button onClick={() => { onLire(String(lecture.index)); setEtat("idle"); }}
                          style={{ ...S.btn, background: C.vert, color: "#fff", padding: "5px 10px", fontSize: 12 }}>✓ Utiliser</button>
                        <button onClick={() => setEtat("idle")}
                          style={{ ...S.btn, background: "#fff", color: C.gris, border: `1px solid ${C.bord}`, padding: "5px 10px", fontSize: 12 }}>Ignorer</button>
                      </div>
                    </div>
                  ) : (
                    <div style={{ background: C.rougeFond, border: `1px solid ${C.rouge}`, borderRadius: 8, padding: 8, fontSize: 12, color: C.rouge }}>
                      Lecture impossible — saisir l'index à la main.
                      <button onClick={() => setEtat("idle")} style={{ ...S.btn, background: "#fff", color: C.gris, border: `1px solid ${C.bord}`, padding: "4px 8px", fontSize: 11, marginTop: 6 }}>OK</button>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      ) : (
        <>
          <button onClick={() => inputRef.current.click()}
            style={{ ...S.btn, background: C.fond, color: C.bleu, border: `1px dashed ${C.cyan}`, width: 88, height: 88, fontSize: 12 }}>
            📷 Photo
          </button>
          <input ref={inputRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={handle} />
        </>
      )}
    </div>
  );
}

function Badge({ children, type = "info" }) {
  const map = {
    ok: { bg: C.vertFond, fg: C.vert }, alerte: { bg: C.rougeFond, fg: C.rouge },
    warn: { bg: C.orangeFond, fg: C.orange }, info: { bg: "#eaf2f7", fg: C.bleu },
  };
  const c = map[type] || map.info;
  return <span style={{ background: c.bg, color: c.fg, padding: "3px 9px", borderRadius: 20, fontSize: 12, fontWeight: 700 }}>{children}</span>;
}

// ------------------------------------------------------------------
// Écran : Fiche immeuble (édition infos + compteur principal + relevés initiaux)
// ------------------------------------------------------------------
function FicheImmeuble({ imm, onChange }) {
  const set = (path, val) => {
    const copy = JSON.parse(JSON.stringify(imm));
    const keys = path.split(".");
    let o = copy;
    for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
    o[keys[keys.length - 1]] = val;
    onChange(copy);
  };

  const addInitial = () => {
    if (imm.releveInitiaux.length >= 2) return;
    onChange({ ...imm, releveInitiaux: [...imm.releveInitiaux, { date: today(), valeur: "" }] });
  };
  const setInitial = (i, k, v) => {
    const arr = imm.releveInitiaux.map((r, idx) => idx === i ? { ...r, [k]: v } : r);
    onChange({ ...imm, releveInitiaux: arr });
  };
  const delInitial = (i) => onChange({ ...imm, releveInitiaux: imm.releveInitiaux.filter((_, idx) => idx !== i) });

  // moyenne base initiale
  let baseMoyenne = null;
  if (imm.releveInitiaux.length === 2) {
    const a = parseFloat(imm.releveInitiaux[0].valeur), b = parseFloat(imm.releveInitiaux[1].valeur);
    if (!isNaN(a) && !isNaN(b)) baseMoyenne = Math.abs(b - a);
  }

  return (
    <div>
      <div style={S.carte}>
        <h3 style={{ marginTop: 0, color: C.bleu }}>Copropriété</h3>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <Champ label="Nom de la copro" value={imm.copro.nom} onChange={(v) => set("copro.nom", v)} placeholder="Résidence Les Tilleuls" />
          <Champ label="N° de copropriété" value={imm.copro.numero} onChange={(v) => set("copro.numero", v)} placeholder="COPRO-2025-014" />
          <Champ label="Adresse" value={imm.copro.adresse} onChange={(v) => set("copro.adresse", v)} placeholder="12 rue des Lilas" />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 8 }}>
            <Champ label="Code postal" value={imm.copro.cp} onChange={(v) => set("copro.cp", v)} placeholder="75011" />
            <Champ label="Ville" value={imm.copro.ville} onChange={(v) => set("copro.ville", v)} placeholder="Paris" />
          </div>
        </div>
      </div>

      <div style={S.carte}>
        <h3 style={{ marginTop: 0, color: C.bleu }}>Gestionnaire</h3>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <Champ label="Société" value={imm.gestionnaire.societe} onChange={(v) => set("gestionnaire.societe", v)} placeholder="Cabinet Durand" />
          <Champ label="Contact" value={imm.gestionnaire.contact} onChange={(v) => set("gestionnaire.contact", v)} placeholder="M. Durand" />
          <Champ label="Téléphone" value={imm.gestionnaire.tel} onChange={(v) => set("gestionnaire.tel", v)} placeholder="01 23 45 67 89" />
          <Champ label="Email" value={imm.gestionnaire.email} onChange={(v) => set("gestionnaire.email", v)} placeholder="contact@cabinet.fr" />
        </div>
      </div>

      <div style={S.carte}>
        <h3 style={{ marginTop: 0, color: C.bleu }}>Compteur principal</h3>
        <div style={{ display: "flex", gap: 16, alignItems: "flex-end", flexWrap: "wrap" }}>
          <div style={{ flex: 1, minWidth: 160 }}>
            <Champ label="N° compteur" value={imm.principal.numero} onChange={(v) => set("principal.numero", v)} placeholder="CPT-PRINC-001" />
          </div>
          <div style={{ flex: 2, minWidth: 200 }}>
            <Champ label="Emplacement" value={imm.principal.emplacement} onChange={(v) => set("principal.emplacement", v)} placeholder="Local technique RDC, à gauche" />
          </div>
          <PhotoInput photoId={imm.principal.photoId} label="Photo"
            onCapture={(id) => set("principal.photoId", id)} onRemove={() => set("principal.photoId", null)} />
        </div>
      </div>

      <div style={S.carte}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <h3 style={{ margin: 0, color: C.bleu }}>Relevés initiaux (base)</h3>
          {imm.releveInitiaux.length < 2 && (
            <button onClick={addInitial} style={{ ...S.btn, background: C.fond, color: C.bleu, border: `1px solid ${C.cyan}` }}>+ Ajouter un relevé</button>
          )}
        </div>
        <p style={{ color: C.gris, fontSize: 13, marginTop: 6 }}>Saisissez 1 ou 2 anciens relevés du compteur principal pour établir une base de comparaison.</p>
        {imm.releveInitiaux.map((r, i) => (
          <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-end", marginTop: 8 }}>
            <div style={{ flex: 1 }}><Champ label="Date" type="date" value={r.date} onChange={(v) => setInitial(i, "date", v)} /></div>
            <div style={{ flex: 1 }}><Champ label="Index (m³)" type="number" value={r.valeur} onChange={(v) => setInitial(i, "valeur", v)} placeholder="1250" /></div>
            <button onClick={() => delInitial(i)} style={{ ...S.btn, background: C.rougeFond, color: C.rouge }}>×</button>
          </div>
        ))}
        {baseMoyenne !== null && (
          <div style={{ marginTop: 12 }}><Badge type="ok">Base : {nf(baseMoyenne)} m³ consommés entre les 2 relevés</Badge></div>
        )}
      </div>

      <div style={S.carte}>
        <h3 style={{ marginTop: 0, color: C.bleu }}>Seuil d'alerte réseau</h3>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <span style={{ fontSize: 14, color: C.texte }}>Alerter si l'écart principal / somme divisionnaires dépasse</span>
          <input type="number" value={Math.round((imm.seuilReseau ?? SEUIL_RESEAU_DEFAUT) * 100)}
            onChange={(e) => onChange({ ...imm, seuilReseau: (parseFloat(e.target.value) || 0) / 100 })}
            style={{ ...S.input, width: 70 }} />
          <span style={{ fontSize: 14, color: C.texte }}>%</span>
        </div>
      </div>
    </div>
  );
}

// Écran : Campagnes de visite
// ------------------------------------------------------------------
function Campagnes({ imm, onChange, onRapport }) {
  const [ouverte, setOuverte] = useState(null);

  const addVisite = () => {
    const v = nouvelleVisite(imm);
    const copy = { ...imm, visites: [v, ...imm.visites] };
    onChange(copy);
    setOuverte(v.id);
  };

  const majVisite = (vid, patch) => {
    onChange({ ...imm, visites: imm.visites.map((v) => v.id === vid ? { ...v, ...patch } : v) });
  };
  const delVisite = (vid) => {
    if (!confirm("Supprimer cette visite ?")) return;
    onChange({ ...imm, visites: imm.visites.filter((v) => v.id !== vid) });
  };

  const addDiv = (vid) => {
    const v = imm.visites.find((x) => x.id === vid);
    const d = { id: uid(), designation: "", numero: "", emplacement: "", valeur: "", photoId: null };
    majVisite(vid, { divisionnaires: [...v.divisionnaires, d] });
  };
  const setDiv = (vid, did, k, val) => {
    const v = imm.visites.find((x) => x.id === vid);
    majVisite(vid, { divisionnaires: v.divisionnaires.map((d) => d.id === did ? { ...d, [k]: val } : d) });
  };
  const delDiv = (vid, did) => {
    const v = imm.visites.find((x) => x.id === vid);
    majVisite(vid, { divisionnaires: v.divisionnaires.filter((d) => d.id !== did) });
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <h3 style={{ margin: 0, color: C.bleu }}>Campagnes de visite</h3>
        <button onClick={addVisite} style={{ ...S.btn, background: C.bleu, color: "#fff" }}>+ Nouvelle visite</button>
      </div>

      {imm.visites.length === 0 && (
        <div style={{ ...S.carte, textAlign: "center", color: C.gris }}>Aucune visite. Créez-en une pour saisir les relevés.</div>
      )}

      {imm.visites.map((v, idx) => {
        const precedente = imm.visites[idx + 1]; // visites triées desc
        const a = analyseVisite(imm, v, precedente);
        const vars = variationsAppart(imm, idx);
        const nbAlertesAppart = vars.filter((x) => x.alerte).length;
        const estOuverte = ouverte === v.id;
        return (
          <div key={v.id} style={S.carte}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}
              onClick={() => setOuverte(estOuverte ? null : v.id)}>
              <div>
                <span style={{ fontWeight: 700, fontSize: 16 }}>Visite du {v.date}</span>
                <div style={{ marginTop: 6, display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <Badge type={a.complet ? "ok" : "warn"}>{a.complets}/{a.total} relevés</Badge>
                  {a.alerteReseau && <Badge type="alerte">Écart réseau {pf(Math.abs(a.ecartReseauPct))}</Badge>}
                  {nbAlertesAppart > 0 && <Badge type="alerte">{nbAlertesAppart} appart. en hausse</Badge>}
                  {a.complet && !a.alerteReseau && nbAlertesAppart === 0 && <Badge type="ok">RAS</Badge>}
                </div>
              </div>
              <span style={{ color: C.cyan, fontSize: 20 }}>{estOuverte ? "▾" : "›"}</span>
            </div>

            {estOuverte && (
              <div style={{ marginTop: 16, borderTop: `1px solid ${C.bord}`, paddingTop: 16 }}>
                <div style={{ display: "flex", gap: 12, alignItems: "flex-end", flexWrap: "wrap", marginBottom: 16 }}>
                  <div style={{ width: 150 }}><Champ label="Date visite" type="date" value={v.date} onChange={(val) => majVisite(v.id, { date: val })} /></div>
                  <div style={{ width: 160 }}><Champ label="Index principal (m³)" type="number" value={v.principalValeur} onChange={(val) => majVisite(v.id, { principalValeur: val })} placeholder="1580" /></div>
                  <PhotoInput photoId={v.principalPhotoId} label="Photo principal"
                    onCapture={(id) => majVisite(v.id, { principalPhotoId: id })}
                    onRemove={() => majVisite(v.id, { principalPhotoId: null })} />
                </div>

                {a.complet && (
                  <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 16 }}>
                    <KPI label="Index principal" val={`${nf(a.principal)} m³`} />
                    <KPI label="Somme divisionnaires" val={`${nf(a.sommeDiv)} m³`} />
                    <KPI label="Écart réseau" val={`${nf(a.ecartReseau)} m³ (${pf(a.ecartReseauPct)})`}
                      alerte={a.alerteReseau} />
                  </div>
                )}

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <strong style={{ color: C.bleu }}>Compteurs divisionnaires</strong>
                  <button onClick={() => addDiv(v.id)} style={{ ...S.btn, background: C.fond, color: C.bleu, border: `1px solid ${C.cyan}`, padding: "7px 12px" }}>+ Compteur</button>
                </div>

                {v.divisionnaires.map((d) => {
                  const vv = vars.find((x) => x.designation === d.designation && x.numero === d.numero);
                  return (
                    <div key={d.id} style={{ background: C.fond, borderRadius: 10, padding: 12, marginBottom: 10, border: vv?.alerte ? `1px solid ${C.rouge}` : `1px solid ${C.bord}` }}>
                      <div style={{ display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap" }}>
                        <div style={{ flex: 1, minWidth: 130 }}><Champ label="Appartement / lot" value={d.designation} onChange={(val) => setDiv(v.id, d.id, "designation", val)} placeholder="Appt A3" /></div>
                        <div style={{ width: 130 }}><Champ label="N° compteur" value={d.numero} onChange={(val) => setDiv(v.id, d.id, "numero", val)} placeholder="DIV-A3" /></div>
                        <div style={{ flex: 1, minWidth: 130 }}><Champ label="Emplacement" value={d.emplacement} onChange={(val) => setDiv(v.id, d.id, "emplacement", val)} placeholder="Palier 3e" /></div>
                        <div style={{ width: 110 }}><Champ label="Index (m³)" type="number" value={d.valeur} onChange={(val) => setDiv(v.id, d.id, "valeur", val)} placeholder="120" /></div>
                        <PhotoInput photoId={d.photoId} label="Photo"
                          onCapture={(id) => setDiv(v.id, d.id, "photoId", id)}
                          onRemove={() => setDiv(v.id, d.id, "photoId", null)} />
                        <button onClick={() => delDiv(v.id, d.id)} style={{ ...S.btn, background: C.rougeFond, color: C.rouge }}>×</button>
                      </div>
                      {vv && vv.variation !== null && (
                        <div style={{ marginTop: 8 }}>
                          <Badge type={vv.alerte ? "alerte" : "info"}>
                            Conso {nf(vv.consoActuelle)} m³ · variation {pf(vv.variation)} vs période précédente
                          </Badge>
                        </div>
                      )}
                    </div>
                  );
                })}

                <div style={{ display: "flex", gap: 10, marginTop: 14, borderTop: `1px solid ${C.bord}`, paddingTop: 14 }}>
                  <button onClick={() => onRapport(v.id)} style={{ ...S.btn, background: C.bleuClair, color: "#fff" }}>📄 Générer le rapport</button>
                  <button onClick={() => delVisite(v.id)} style={{ ...S.btn, background: C.rougeFond, color: C.rouge }}>Supprimer la visite</button>
                </div>

                {(a.alerteReseau || nbAlertesAppart > 0) && (
                  <div style={{ marginTop: 12, background: C.rougeFond, border: `1px solid ${C.rouge}`, borderRadius: 8, padding: 12, color: C.rouge, fontSize: 14 }}>
                    ⚠️ Anomalie détectée — une recherche de fuite Eauvéa est recommandée.
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function KPI({ label, val, alerte }) {
  return (
    <div style={{ background: alerte ? C.rougeFond : C.fond, border: `1px solid ${alerte ? C.rouge : C.bord}`, borderRadius: 10, padding: "10px 14px", minWidth: 140 }}>
      <div style={{ fontSize: 11, color: C.gris, textTransform: "uppercase", letterSpacing: ".04em", fontWeight: 600 }}>{label}</div>
      <div style={{ fontSize: 16, fontWeight: 700, color: alerte ? C.rouge : C.texte, marginTop: 2 }}>{val}</div>
    </div>
  );
}

// ------------------------------------------------------------------
// Export Excel (SheetJS) — 1 fichier / immeuble, historique empilé + synthèse
// ------------------------------------------------------------------
async function exportExcel(imm) {
  const XLSX = await ensureXLSX();
  const wb = XLSX.utils.book_new();

  // Feuille INFOS
  const infos = [
    ["EAUVÉA — Fiche immeuble"],
    [],
    ["Copropriété", imm.copro.nom],
    ["N° copro", imm.copro.numero],
    ["Adresse", `${imm.copro.adresse} ${imm.copro.cp} ${imm.copro.ville}`],
    ["Gestionnaire", imm.gestionnaire.societe],
    ["Contact", imm.gestionnaire.contact],
    ["Téléphone", imm.gestionnaire.tel],
    ["Email", imm.gestionnaire.email],
    ["Compteur principal", imm.principal.numero],
    ["Emplacement principal", imm.principal.emplacement],
    ["Seuil alerte réseau", `${Math.round((imm.seuilReseau ?? SEUIL_RESEAU_DEFAUT) * 100)} %`],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(infos), "Infos");

  // Feuille HISTORIQUE — chaque visite empilée
  const hist = [["Date visite", "Type", "Appartement/Lot", "N° compteur", "Emplacement", "Index (m³)", "Photo"]];
  const visitesAsc = [...imm.visites].sort((a, b) => a.date.localeCompare(b.date));
  visitesAsc.forEach((v) => {
    hist.push([v.date, "PRINCIPAL", "—", imm.principal.numero, imm.principal.emplacement, parseFloat(v.principalValeur) || "", photoName(imm, v, "principal")]);
    v.divisionnaires.forEach((d) => {
      hist.push([v.date, "Divisionnaire", d.designation, d.numero, d.emplacement, parseFloat(d.valeur) || "", photoName(imm, v, d)]);
    });
    hist.push([]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(hist), "Historique");

  // Feuille SYNTHÈSE — écart réseau par visite
  const syn = [["Date visite", "Index principal", "Somme divisionnaires", "Écart réseau (m³)", "Écart %", "Relevés complets", "Alerte réseau"]];
  visitesAsc.forEach((v, i) => {
    const prec = visitesAsc[i - 1];
    const a = analyseVisite(imm, v, prec);
    syn.push([
      v.date, a.principal || "", a.complet ? a.sommeDiv : "", a.complet ? a.ecartReseau : "",
      a.complet && a.ecartReseauPct !== null ? Math.round(a.ecartReseauPct * 1000) / 10 + " %" : "",
      `${a.complets}/${a.total}`, a.alerteReseau ? "OUI" : "",
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(syn), "Synthèse réseau");

  // Feuille SYNTHÈSE APPART — variation par appartement, une colonne par visite
  const appartKeys = {};
  imm.visites.forEach((v) => v.divisionnaires.forEach((d) => { appartKeys[`${d.designation}|${d.numero}`] = { designation: d.designation, numero: d.numero }; }));
  const dates = visitesAsc.map((v) => v.date);
  const synA = [["Appartement/Lot", "N° compteur", ...dates.map((d) => `Index ${d}`), ...dates.slice(1).map((d) => `Conso ${d}`)]];
  Object.values(appartKeys).forEach((ap) => {
    const indexes = visitesAsc.map((v) => {
      const d = v.divisionnaires.find((x) => x.designation === ap.designation && x.numero === ap.numero);
      return d ? (parseFloat(d.valeur) || "") : "";
    });
    const consos = [];
    for (let i = 1; i < indexes.length; i++) {
      consos.push(indexes[i] !== "" && indexes[i - 1] !== "" ? indexes[i] - indexes[i - 1] : "");
    }
    synA.push([ap.designation, ap.numero, ...indexes, ...consos]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(synA), "Synthèse appart");

  const nom = `Eauvea_${slug(imm.copro.nom) || "immeuble"}.xlsx`;
  XLSX.writeFile(wb, nom);
}

function photoName(imm, visite, d) {
  const base = slug(imm.copro.nom) || "IMM";
  if (d === "principal") return visite.principalPhotoId ? `${base}_${visite.date}_PRINCIPAL.jpg` : "";
  return d.photoId ? `${base}_${visite.date}_${slug(d.designation) || slug(d.numero) || "DIV"}.jpg` : "";
}

// ------------------------------------------------------------------
// Export photos (.zip)
// ------------------------------------------------------------------
async function exportPhotos(imm) {
  const JSZip = await ensureJSZip();
  const zip = new JSZip();
  let count = 0;

  const addPhoto = async (photoId, name) => {
    if (!photoId) return;
    const p = await dbGet("photos", photoId);
    if (!p) return;
    const b64 = p.data.split(",")[1];
    zip.file(name, b64, { base64: true });
    count++;
  };

  if (imm.principal.photoId) await addPhoto(imm.principal.photoId, `${slug(imm.copro.nom) || "IMM"}_PRINCIPAL_fiche.jpg`);
  for (const v of imm.visites) {
    await addPhoto(v.principalPhotoId, photoName(imm, v, "principal"));
    for (const d of v.divisionnaires) await addPhoto(d.photoId, photoName(imm, v, d));
  }

  if (count === 0) { alert("Aucune photo à exporter."); return; }
  const blob = await zip.generateAsync({ type: "blob" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `Eauvea_photos_${slug(imm.copro.nom) || "immeuble"}.zip`;
  a.click();
  URL.revokeObjectURL(url);
}

// Rapport d'écart (HTML) avec photos

async function genererRapport(imm, visiteId) {
  const idx = imm.visites.findIndex((v) => v.id === visiteId);
  const v = imm.visites[idx];
  const prec = imm.visites[idx + 1];
  const a = analyseVisite(imm, v, prec);
  const vars = variationsAppart(imm, idx);
  const alertesAppart = vars.filter((x) => x.alerte);

  // photos
  const getPhoto = async (id) => id ? (await dbGet("photos", id))?.data || null : null;

  for (const d of v.divisionnaires) if (d.photoId) divPhotos[d.id] = await getPhoto(d.photoId);

  const anomalie = a.alerteReseau || alertesAppart.length > 0;
  const verdictTexte = anomalie ? "Anomalie détectée — recherche de fuite recommandée" : "Aucune anomalie majeure détectée";
  const verdictCoul = anomalie ? "#c0392b" : "#1e8449";

  .section { padding: 20px 34px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .kpi { flex: 1; min-width: 150px; border: 1px solid #dbe4ea; border-radius: 10px; padding: 12px 16px; }
  .kpi .l { font-size: 11px; color: #6b7d88; text-transform: uppercase; font-weight: 700; }
  .kpi .v { font-size: 20px; font-weight: 800; margin-top: 4px; }
  h2 { color: #0a4b6e; font-size: 16px; margin-bottom: 10px; border-bottom: 2px solid #2ea3c9; padding-bottom: 5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #eaf2f7; color: #0a4b6e; text-align: left; padding: 8px 10px; }
  td { padding: 8px 10px; border-bottom: 1px solid #eef3f6; }
  tr.alerte td { background: #fdecea; color: #c0392b; font-weight: 700; }
  .photos { display: flex; flex-wrap: wrap; gap: 10px; }
  .photo { width: 150px; }
  .photo img { width: 100%; border-radius: 8px; border: 1px solid #dbe4ea; }
  .photo .cap { font-size: 11px; color: #6b7d88; margin-top: 4px; }
  .cta { margin: 8px 34px 24px; background: #0a4b6e; color: #fff; border-radius: 12px; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
  .cta .btn { background: #2ea3c9; padding: 12px 20px; border-radius: 8px; font-weight: 700; }
  .footer { background: #0a4b6e; color: #cfe2ec; padding: 16px 34px; font-size: 12px; text-align: center; }
</style></head><body>
<div class="page">
  <div class="header">
    <div class="logo"><img src="${LOGO}" alt="Eauvéa"></div>
    <div style="text-align:right;font-size:13px">
      <div style="font-weight:700">${imm.copro.nom}</div>
      <div>${imm.copro.adresse}, ${imm.copro.cp} ${imm.copro.ville}</div>
      <div>Visite du ${v.date}</div>
    </div>
  </div>
  <div class="verdict">${verdictTexte}</div>

  <div class="section">
    <h2>Bilan réseau</h2>
    <div class="grid">
      <div class="kpi"><div class="l">Index principal</div><div class="v">${nf(a.principal)} m³</div></div>
      <div class="kpi"><div class="l">Somme divisionnaires</div><div class="v">${a.complet ? nf(a.sommeDiv) : "—"} m³</div></div>
      <div class="kpi"><div class="l">Écart réseau</div><div class="v" style="color:${a.alerteReseau ? "#c0392b" : "#1e8449"}">${a.complet ? nf(a.ecartReseau) : "—"} m³ · ${a.complet ? pf(a.ecartReseauPct) : "—"}</div></div>
      <div class="kpi"><div class="l">Relevés</div><div class="v">${a.complets}/${a.total}</div></div>
    </div>

  ${alertesAppart.length > 0 ? `

  <div class="section">
    <h2>Relevés de la visite</h2>
    <table><thead><tr><th>Type</th><th>Appartement/Lot</th><th>N° compteur</th><th>Emplacement</th><th>Index (m³)</th></tr></thead><tbody>
      <tr><td><b>Principal</b></td><td>—</td><td>${imm.principal.numero}</td><td>${imm.principal.emplacement}</td><td>${nf(a.principal)}</td></tr>

      }).join("")}
    </tbody></table>
  </div>

  ${(photoPrinc || Object.keys(divPhotos).length) ? `
  <div class="section">
    <h2>Photos des compteurs</h2>
    <div class="photos">
      ${photoPrinc ? `<div class="photo"><img src="${photoPrinc}"><div class="cap">Compteur principal — ${imm.principal.emplacement}</div></div>` : ""}
      ${v.divisionnaires.filter((d) => divPhotos[d.id]).map((d) => `<div class="photo"><img src="${divPhotos[d.id]}"><div class="cap">${d.designation} (${d.numero}) — ${d.emplacement}</div></div>`).join("")}
    </div>
  </div>` : ""}

  <div class="cta">
    <div><div style="font-size:17px;font-weight:800">Besoin d'une recherche de fuite ?</div>
    <div style="opacity:.85;font-size:13px">Nos techniciens Eauvéa localisent l'origine de l'écart sans casse.</div></div>
    <div class="btn">Contacter Eauvéa</div>
  </div>

  <div class="footer">EAUVÉA · Détection de fuite & suivi de consommation · Rapport généré le ${today()}</div>
</div>
</body></html>`;

  const w = window.open("", "_blank");
  w.document.write(html);
  w.document.close();
}

// ------------------------------------------------------------------
// App principale
// ------------------------------------------------------------------
function App() {
  const [immeubles, setImmeubles] = useState([]);
  const [selId, setSelId] = useState(null);
  const [onglet, setOnglet] = useState("fiche");
  const [chargement, setChargement] = useState(true);

  useEffect(() => { dbGetAll("immeubles").then((arr) => { setImmeubles(arr.sort((a, b) => (b.creeLe || "").localeCompare(a.creeLe || ""))); setChargement(false); }); }, []);

  const sel = immeubles.find((i) => i.id === selId);

  const saveImm = useCallback(async (imm) => {
    await dbPut("immeubles", imm);
    setImmeubles((prev) => prev.map((i) => i.id === imm.id ? imm : i));
  }, []);

  const newImm = async () => {
    const imm = nouvelImmeuble();
    await dbPut("immeubles", imm);
    setImmeubles((prev) => [imm, ...prev]);
    setSelId(imm.id); setOnglet("fiche");
  };

  const delImm = async (id) => {
    if (!confirm("Supprimer cet immeuble et toutes ses visites ?")) return;
    await dbDelete("immeubles", id);
    setImmeubles((prev) => prev.filter((i) => i.id !== id));
    if (selId === id) setSelId(null);
  };

  if (chargement) return <div style={{ padding: 40, fontFamily: "Arial", color: C.gris }}>Chargement…</div>;

  return (
    <div style={{ minHeight: "100vh", background: C.fond, fontFamily: "Arial, Helvetica, sans-serif", color: C.texte }}>
      <div style={{ background: `linear-gradient(135deg,${C.bleu},${C.cyan})`, color: "#fff", padding: "18px 24px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, cursor: "pointer" }} onClick={() => setSelId(null)}>
          <div style={{ background: "#fff", borderRadius: 8, padding: "6px 12px", display: "flex", alignItems: "center" }}>
            <img src={LOGO} alt="Eauvéa" style={{ height: 34, display: "block" }} />
          </div>
          <span style={{ fontWeight: 600, fontSize: 13, opacity: .9, letterSpacing: "1px" }}>PRO</span>
        </div>
        {sel && <div style={{ fontSize: 14, opacity: .9 }}>{sel.copro.nom || "Nouvel immeuble"}</div>}
      </div>

      <div style={{ maxWidth: 920, margin: "0 auto", padding: "22px 18px 60px" }}>
        {!sel ? (
          <ListeImmeubles immeubles={immeubles} onOpen={(id) => { setSelId(id); setOnglet("fiche"); }} onNew={newImm} onDelete={delImm} />
        ) : (
          <div>
            <button onClick={() => setSelId(null)} style={{ ...S.btn, background: "transparent", color: C.bleu, padding: "6px 0", marginBottom: 10 }}>‹ Retour aux immeubles</button>

            <div style={{ display: "flex", gap: 6, marginBottom: 18, borderBottom: `1px solid ${C.bord}` }}>
              {[["fiche", "Fiche immeuble"], ["visites", "Campagnes"], ["export", "Exports"]].map(([k, lbl]) => (
                <button key={k} onClick={() => setOnglet(k)}
                  style={{ ...S.btn, background: "transparent", color: onglet === k ? C.bleu : C.gris, borderBottom: onglet === k ? `3px solid ${C.cyan}` : "3px solid transparent", borderRadius: 0, padding: "10px 14px" }}>{lbl}</button>
              ))}
            </div>

            {onglet === "fiche" && <FicheImmeuble imm={sel} onChange={saveImm} />}
            {onglet === "visites" && <Campagnes imm={sel} onChange={saveImm} onRapport={(vid) => genererRapport(sel, vid)} />}
            {onglet === "export" && (
              <div style={S.carte}>
                <h3 style={{ marginTop: 0, color: C.bleu }}>Exporter les données</h3>
                <p style={{ color: C.gris, fontSize: 14 }}>Un fichier Excel par immeuble : toutes les visites empilées + synthèses (écart réseau, variation par appartement). Les photos sont référencées par leur nom dans l'Excel et exportables en archive .zip séparée.</p>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginTop: 14 }}>
                  <button onClick={() => exportExcel(sel)} style={{ ...S.btn, background: C.vert, color: "#fff" }}>📊 Télécharger l'Excel</button>
                  <button onClick={() => exportPhotos(sel)} style={{ ...S.btn, background: C.bleuClair, color: "#fff" }}>🖼️ Exporter les photos (.zip)</button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}


const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
<script>
// Service worker pour installation PWA + cache hors-ligne (données restent dans IndexedDB)
if ("serviceWorker" in navigator) {
  const swCode = `
    const CACHE = "eauvea-v1";
    self.addEventListener("install", (e) => { self.skipWaiting(); });
    self.addEventListener("activate", (e) => { e.waitUntil(self.clients.claim()); });
    self.addEventListener("fetch", (e) => {
      e.respondWith(
        caches.open(CACHE).then((cache) =>
          cache.match(e.request).then((cached) => {
            const net = fetch(e.request).then((res) => {
              if (e.request.method === "GET" && res.status === 200) cache.put(e.request, res.clone());
              return res;
            }).catch(() => cached);
            return cached || net;
          })
        )
      );
    });
  `;
  const blob = new Blob([swCode], { type: "application/javascript" });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
</script>
</body>
</html>
